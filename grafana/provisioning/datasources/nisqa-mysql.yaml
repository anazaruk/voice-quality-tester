apiVersion: 1

datasources:
  - name: mysql
    uid: voice-quality-mysql
    type: mysql
    access: proxy
    url: 127.0.0.1:3306
    user: nisqa
    secureJsonData:
      password: CHANGE_ME
    jsonData:
      database: voice_quality
      maxOpenConns: 25
      maxIdleConns: 25
      connMaxLifetime: 14400
    isDefault: true
    editable: true

  - name: prometheus
    uid: voice-quality-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: false
    editable: true
